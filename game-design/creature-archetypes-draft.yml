# Архетипы противников (creature_archetypes) — абстрактные «болванки»,
# привязанные к уровню угрозы, а не к конкретному существу.
#
# Идея: механика детерминирована (таблица), оболочка — нарративная (LLM).
# LLM получает список доступных кодов на уровень игрока и выбирает болванку,
# сама придумывая имя/описание под сеттинг: «рыцарь-скелет» и «корпо-секьюрити»
# могут быть одной болванкой elite_2.
#
# Калибровка — под СОЛО-игрока (основной режим):
# - XP-база = SRD 5e «XP Thresholds per character» (medium budget) на уровень.
# - HP-база подобрана так, чтобы рядовой умирал за 2–3 попадания игрока своего уровня.
# - Существующие тестовые фикстуры остаются валидными:
#   Кабан hp12/ac11/+3/1d6+2/50xp == recruit_1 (ровно база 1 уровня).

# ---------------------------------------------------------------------------
# Базовые параметры по уровню противника (== уровень игрока, которому он ровня).
# ---------------------------------------------------------------------------
base_by_level:
  - level: 1
    hp: 12
    ac: 11
    attack_bonus: 3
    damage_dice: 1d6
    damage_bonus: 2
    xp: 50        # SRD medium solo L1; == Кабан/Иглобрюх из текущих тестов
  - level: 2
    hp: 16
    ac: 11
    attack_bonus: 3
    damage_dice: 1d6
    damage_bonus: 2
    xp: 100
  - level: 3
    hp: 20
    ac: 12
    attack_bonus: 4
    damage_dice: 1d8
    damage_bonus: 2
    xp: 150
  - level: 4
    hp: 24
    ac: 12
    attack_bonus: 4
    damage_dice: 1d8
    damage_bonus: 3
    xp: 250
  - level: 5
    hp: 28
    ac: 13
    attack_bonus: 5
    damage_dice: 1d10
    damage_bonus: 3
    xp: 500
  - level: 6
    hp: 32
    ac: 13
    attack_bonus: 5
    damage_dice: 1d10
    damage_bonus: 4
    xp: 600
  - level: 7
    hp: 36
