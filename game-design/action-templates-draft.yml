# Глобальный каталог шаблонов действий игрока (черновик)
# Целевой потребитель: детерминированный rules-engine (Yorva AI TTRPG).
# Поля: code (snake_case, уникальный), category, name_ru, attribute, skill,
# dc_medium (типичная средняя сложность: 10/12/15/18/20 или null),
# description (одно предложение), keywords (русские основы с \w* для regex-fallback).
#
# Допущения:
# - Шаблоны атаки (melee_attack, ranged_attack, spell_attack и т.п.) НЕ содержат
#   attribute/skill/dc: попадание и урон движок считает по каталогу оружия
#   (weapon_categories/weapons) и заклинаний (spell_families) — см. ability-checks-brief.md.
# - Состязательные действия (grapple, shove, feint, hide...) имеют dc_medium=null,
#   т.к. разрешаются состязанием/пассивной защитой цели, а не фиксированным DC.
# - Чисто механические действия без броска (открыть дверь, поднять рычаг, отдых)
#   и narrative-действия имеют null во всех механических полях.
# - skill/attribute используют канонические пары D&D 5e (athletics=STR и т.д.).
# - Множественные появления действия в разных списках (dash, craft_item, pick_pocket...)
#   сведены к ОДНОЙ записи в наиболее репрезентативной категории (code уникален).

